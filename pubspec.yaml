name: ondevicerx
description: "On-Device Pharmacogenomics Prescription Safety Checker for iQOO Hackathon 2026."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^10.0.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Firebase & Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  firebase_app_check: ^0.3.0+1
  google_sign_in: ^6.2.1

  # Networking, Env, & Storage
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/samples/
    - .env


