name: ondevicerx
description: "On-Device Pharmacogenomics Prescription Safety Checker for iQOO Hackathon 2026."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  image_picker: ^1.1.2
  file_picker: ^12.2.0
  pdf: ^3.10.8
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Networking, Env, & Storage
  http: ^1.2.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/samples/
    - assets/config/
    - .env
